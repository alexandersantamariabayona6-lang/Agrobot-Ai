<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgroBot AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --hoja: #12301f; --limon: #f2d541; --papel: #f4f7ef; --alerta: #e0603a; --suave: #9fb8a6;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--hoja); color: var(--papel);
    font-family: "Bricolage Grotesque", system-ui, sans-serif; }
  .app { display: flex; flex-direction: column; height: 100%; max-width: 640px; margin: 0 auto; }
  header { padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -.01em; }
  header h1 span { color: var(--limon); }
  #estado { font-size: .8rem; color: var(--suave); }
  .visor { position: relative; flex: 0 0 42%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vacio { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 24px; color: var(--suave); }
  .pulso { position: absolute; top: 12px; right: 12px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--limon); display: none; }
  .pulso.on { display: block; animation: p 1s infinite; }
  @keyframes p { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .pulso.on { animation: none; } }
  .controles { display: flex; gap: 8px; padding: 12px 16px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--limon); outline-offset: 2px; }
  .principal { flex: 1; background: var(--limon); color: var(--hoja); }
  .sec { background: #1d4430; color: var(--papel); }
  .sec.activo { background: var(--papel); color: var(--hoja); }
  .panel { flex: 1; overflow-y: auto; padding: 4px 16px 24px; }
  .resultado { background: var(--papel); color: var(--hoja); border-radius: 14px; padding: 16px; }
  .resultado h2 { font-size: 1.25rem; line-height: 1.2; margin-bottom: 6px; }
  .visible { font-size: .92rem; opacity: .8; margin-bottom: 10px; }
  .barra { height: 8px; background: #d6e0d0; border-radius: 99px; overflow: hidden; margin: 4px 0 12px; }
  .barra i { display: block; height: 100%; background: var(--hoja); }
  .resultado h3 { font-size: .95rem; margin: 10px 0 4px; }
  .resultado ul { padding-left: 18px; font-size: .92rem; line-height: 1.45; }
  .pedir { margin-top: 12px; padding: 10px 12px; border-left: 4px solid var(--alerta);
    background: #fbe9e2; font-size: .9rem; }
  .hist { margin-top: 18px; }
  .hist h3 { font-size: .9rem; color: var(--suave); margin-bottom: 6px; font-weight: 600; }
  .hist li { font-size: .88rem; padding: 6px 0; border-top: 1px solid #25503a; list-style: none; }
  .error { color: #ffb4a0; padding: 8px 0; font-size: .9rem; }
  .aviso { font-size: .75rem; color: var(--suave); margin-top: 14px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Agrobot <span>AI</span></h1>
    <div id="estado">Cámara apagada</div>
  </header>

  <div class="visor">
    <video id="video" playsinline muted></video>
    <div class="vacio" id="vacio">Toca “Abrir cámara” y apunta al limonero.</div>
    <div class="pulso" id="pulso"></div>
  </div>

  <div class="controles">
    <button class="principal" id="btnCam">Abrir cámara</button>
    <button class="sec" id="btnAnalisis" disabled>Iniciar análisis</button>
    <button class="sec" id="btnVoz" aria-pressed="false">Voz</button>
  </div>

  <div class="panel" id="panel">
    <div id="salida"></div>
    <div class="hist" id="histBox" hidden>
      <h3>Lo que ha detectado</h3>
      <ul id="hist"></ul>
    </div>
    <p class="aviso">Es una orientación y no reemplaza a un ingeniero agrónomo.</p>
  </div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
const INTERVALO_MS = 4000;   // cada cuánto manda un fotograma
const ANCHO_MAX = 640;       // tamaño del fotograma enviado

const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("canvas");
let stream = null, timer = null, ocupado = false, voz = false, ultimoDx = "";

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

async function abrirCamara() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false,
    });
    video.srcObject = stream;
    await video.play();
    $("vacio").hidden = true;
    $("btnCam").textContent = "Cerrar cámara";
    $("btnAnalisis").disabled = false;
    $("estado").textContent = "Cámara lista";
  } catch (e) {
    $("salida").innerHTML = `<p class="error">No pude abrir la cámara: ${esc(e.message)}. Revisa el permiso del navegador y que la página use https.</p>`;
  }
}

function cerrarCamara() {
  pausar();
  stream?.getTracks().forEach((t) => t.stop());
  stream = null; video.srcObject = null;
  $("vacio").hidden = false;
  $("btnCam").textContent = "Abrir cámara";
  $("btnAnalisis").disabled = true;
  $("estado").textContent = "Cámara apagada";
}

function iniciar() {
  $("btnAnalisis").textContent = "Pausar análisis";
  $("btnAnalisis").classList.add("activo");
  $("pulso").classList.add("on");
  $("estado").textContent = "Analizando…";
  analizar();
  timer = setInterval(analizar, INTERVALO_MS);
}

function pausar() {
  clearInterval(timer); timer = null;
  $("btnAnalisis").textContent = "Iniciar análisis";
  $("btnAnalisis").classList.remove("activo");
  $("pulso").classList.remove("on");
  if (stream) $("estado").textContent = "En pausa";
  speechSynthesis.cancel();
}

function capturar() {
  const factor = Math.min(1, ANCHO_MAX / video.videoWidth);
  canvas.width = video.videoWidth * factor;
  canvas.height = video.videoHeight * factor;
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.7);
}

async function analizar() {
  if (ocupado || !video.videoWidth) return;   // no apilar peticiones
  ocupado = true;
  try {
    const r = await fetch("/api/diagnostico", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: capturar() }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Error del servidor");
    mostrar(d);
  } catch (e) {
    $("salida").innerHTML = `<p class="error">${esc(e.message)}</p>`;
  } finally { ocupado = false; }
}

function mostrar(d) {
  if (d.es_limonero === false) {
    $("salida").innerHTML = `<div class="resultado"><h2>No veo un limonero</h2>
      <p class="visible">${esc(d.visible)}</p>
      <div class="pedir">${esc(d.necesita_mas_info || "Apunta la cámara al árbol, a una hoja o a un fruto.")}</div></div>`;
    return;
  }
  const lista = (a) => (a || []).map((x) => `<li>${esc(x)}</li>`).join("");
  const conf = Math.max(0, Math.min(100, Number(d.confianza) || 0));
  $("salida").innerHTML = `<div class="resultado">
    <h2>${esc(d.diagnostico)}</h2>
    <p class="visible">${esc(d.visible)}</p>
    <div>Confianza: ${conf}%</div><div class="barra"><i style="width:${conf}%"></i></div>
    <h3>Causas posibles</h3><ul>${lista(d.causas_posibles)}</ul>
    <h3>Qué hacer</h3><ul>${lista(d.recomendaciones)}</ul>
    ${d.necesita_mas_info ? `<div class="pedir">${esc(d.necesita_mas_info)}</div>` : ""}
  </div>`;

  if (d.diagnostico && d.diagnostico !== ultimoDx) {
    ultimoDx = d.diagnostico;
    $("histBox").hidden = false;
    $("hist").insertAdjacentHTML("afterbegin",
      `<li>${new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })} · ${esc(d.diagnostico)} (${conf}%)</li>`);
    if (voz) hablar(`${d.diagnostico}. ${(d.recomendaciones || [])[0] || ""}`);
  }
}

function hablar(texto) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = "es-CO";
  speechSynthesis.speak(u);
}

$("btnCam").onclick = () => (stream ? cerrarCamara() : abrirCamara());
$("btnAnalisis").onclick = () => (timer ? pausar() : iniciar());
$("btnVoz").onclick = () => {
  voz = !voz;
  $("btnVoz").classList.toggle("activo", voz);
  $("btnVoz").setAttribute("aria-pressed", voz);
  if (voz) hablar("Voz activada");   // desbloquea el audio en el celular
  else speechSynthesis.cancel();
};
</script>
</body>
</html>
