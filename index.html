<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgroBot AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --hoja:#12301f; --limon:#f2d541; --papel:#f4f7ef; --alerta:#e0603a; --suave:#9fb8a6; --medio:#1d4430; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--hoja); color:var(--papel);
    font-family:"Bricolage Grotesque", system-ui, sans-serif; }
  .app { height:100%; max-width:640px; margin:0 auto; display:flex; flex-direction:column; }
  header { padding:14px 16px 8px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:1.35rem; font-weight:800; letter-spacing:-.01em; }
  header h1 span { color:var(--limon); }
  #estado { font-size:.8rem; color:var(--suave); }

  .pantalla { display:none; flex:1; min-height:0; flex-direction:column; }
  .app[data-estado="inicio"] #p-inicio,
  .app[data-estado="escaneo"] #p-escaneo,
  .app[data-estado="espera"] #p-espera,
  .app[data-estado="resultado"] #p-resultado { display:flex; }

  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:14px 16px; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--limon); outline-offset:2px; }
  .principal { background:var(--limon); color:var(--hoja); }
  .sec { background:var(--medio); color:var(--papel); }

  /* inicio */
  #p-inicio { justify-content:center; padding:24px; gap:16px; }
  #p-inicio h2 { font-size:1.9rem; line-height:1.1; font-weight:800; }
  #p-inicio p { color:var(--suave); line-height:1.5; }

  /* escaneo */
  .visor { position:relative; flex:1; background:#000; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  #subtitulo { position:absolute; left:12px; right:12px; bottom:12px; padding:12px 14px; border-radius:12px;
    background:rgba(18,48,31,.88); font-size:1.05rem; line-height:1.35; }
  .barra-esc { display:flex; gap:8px; padding:12px 16px; }
  .barra-esc button { flex:1; }

  /* espera */
  #p-espera { align-items:center; justify-content:center; text-align:center; padding:24px; gap:18px; }
  .orbe { width:96px; height:96px; border-radius:50%; background:var(--limon); animation:resp 1.6s ease-in-out infinite; }
  @keyframes resp { 50% { transform:scale(.8); opacity:.55; } }
  @media (prefers-reduced-motion:reduce) { .orbe { animation:none; } }
  #p-espera h2 { font-size:1.5rem; }
  #linea { color:var(--suave); min-height:3em; }
  #obs { list-style:none; padding:0; width:100%; text-align:left; }
  #obs li { padding:8px 0; border-top:1px solid #25503a; font-size:.92rem; }

  /* resultado */
  #p-resultado { overflow-y:auto; padding:4px 16px 24px; gap:12px; }
  .tarjeta { background:var(--papel); color:var(--hoja); border-radius:14px; padding:16px; }
  .tarjeta h2 { font-size:1.35rem; line-height:1.2; margin-bottom:8px; }
  .barra { height:8px; background:#d6e0d0; border-radius:99px; overflow:hidden; margin:4px 0 12px; }
  .barra i { display:block; height:100%; background:var(--hoja); }
  .tarjeta h3 { font-size:.95rem; margin:10px 0 4px; }
  .tarjeta ul { padding-left:18px; font-size:.92rem; line-height:1.45; }
  .pedir { margin-top:12px; padding:10px 12px; border-left:4px solid var(--alerta); background:#fbe9e2; font-size:.9rem; }
  .acciones { display:flex; gap:8px; }
  .acciones button { flex:1; }
  .error { color:#ffb4a0; font-size:.9rem; padding:6px 16px; }
  .aviso { font-size:.75rem; color:var(--suave); }
</style>
</head>
<body>
<div class="app" id="app" data-estado="inicio">
  <header>
    <h1>Agrobot <span>AI</span></h1>
    <div id="estado">Listo</div>
  </header>

  <section class="pantalla" id="p-inicio">
    <h2>Muéstrame tu limonero y te cuento qué tiene.</h2>
    <p>Te voy a ir guiando con la voz. Sube el volumen del celular, abre la cámara y apúntala hacia el árbol.</p>
    <button class="principal" id="btnEmpezar">Empezar</button>
  </section>

  <section class="pantalla" id="p-escaneo">
    <div class="visor">
      <video id="video" playsinline muted></video>
      <div id="subtitulo">Iniciando cámara…</div>
    </div>
    <div class="barra-esc">
      <button class="sec" id="btnVoz" aria-pressed="true">Voz: activada</button>
      <button class="sec" id="btnCancelar">Cancelar</button>
    </div>
    <div class="error" id="errEscaneo" hidden></div>
  </section>

  <section class="pantalla" id="p-espera">
    <div class="orbe" aria-hidden="true"></div>
    <h2>Recopilando datos</h2>
    <p id="linea">Revisando lo que vi…</p>
    <ul id="obs"></ul>
  </section>

  <section class="pantalla" id="p-resultado">
    <div id="resultado"></div>
    <div class="acciones">
      <button class="sec" id="btnRepetir">Repetir voz</button>
      <button class="principal" id="btnOtro">Escanear otro</button>
    </div>
    <p class="aviso">Es una orientación y no reemplaza a un ingeniero agrónomo.</p>
  </section>
</div>

<canvas id="canvas" hidden></canvas>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const dormir = (ms) => new Promise((r) => setTimeout(r, ms));

const video = $("video"), canvas = $("canvas");
let stream = null, sesion = 0, vozOn = true, obs = [], ultimoResumen = "", timerEspera = null;

/* ---------- voz ---------- */
function hablar(texto) {
  if (!vozOn || !("speechSynthesis" in window) || !texto) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = "es-CO";
  const v = speechSynthesis.getVoices().find((x) => x.lang.toLowerCase().startsWith("es"));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const hablando = () => "speechSynthesis" in window && speechSynthesis.speaking;

/* ---------- pantallas ---------- */
function cambiar(estado) { $("app").dataset.estado = estado; }
function subtitulo(t) { $("subtitulo").textContent = t; }
function setEstado(t) { $("estado").textContent = t; }

/* ---------- cámara ---------- */
async function abrirCamara() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" } }, audio: false,
  });
  video.srcObject = stream;
  await video.play();
}
function apagarCamara() {
  stream?.getTracks().forEach((t) => t.stop());
  stream = null; video.srcObject = null;
}
function capturar(ancho) {
  const f = Math.min(1, ancho / video.videoWidth);
  canvas.width = video.videoWidth * f;
  canvas.height = video.videoHeight * f;
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.7);
}

/* ---------- servidor ---------- */
async function llamar(modo, imagenes) {
  const ctrl = new AbortController();
  const corte = setTimeout(() => ctrl.abort(), 50000);
  try {
    const r = await fetch("/api/diagnostico", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ modo, imagenes }),
      signal: ctrl.signal,
    });
    const txt = await r.text();
    let d;
    try { d = JSON.parse(txt); } catch { throw new Error(`El servidor respondió ${r.status}: ${txt.slice(0, 160)}`); }
    if (!r.ok) throw new Error(`Error ${r.status}: ${d.error || "del servidor"}`);
    return d;
  } catch (e) {
    throw e.name === "AbortError" ? new Error("Tardó demasiado en responder.") : e;
  } finally { clearTimeout(corte); }
}

/* ---------- flujo ---------- */
async function iniciar() {
  const mi = ++sesion;
  obs = [];
  $("errEscaneo").hidden = true;
  cambiar("escaneo");
  subtitulo("Iniciando cámara…");
  setEstado("Buscando el limonero");
  try { await abrirCamara(); }
  catch (e) {
    cambiar("inicio");
    hablar("No pude abrir la cámara. Revisa el permiso del navegador.");
    alert("No pude abrir la cámara: " + e.message + "\nRevisa el permiso y que la página use https.");
    return;
  }
  subtitulo("Apunta la cámara hacia el limonero.");
  hablar("Cámara lista. Apunta hacia el limonero y yo te voy guiando.");
  await dormir(3500);
  await buscar(mi);
}

async function buscar(mi) {
  let seguidos = 0;
  while (mi === sesion) {
    try {
      const d = await llamar("detectar", [capturar(512)]);
      if (mi !== sesion) return;
      $("errEscaneo").hidden = true;
      const frase = d.es_limonero ? `${d.visible}. ${d.guia}` : `No veo el limonero. ${d.guia}`;
      subtitulo(frase);
      if (d.es_limonero && d.visible && !obs.includes(d.visible)) obs.push(d.visible);
      seguidos = d.es_limonero && d.calidad_ok ? seguidos + 1 : 0;
      if (seguidos >= 2) return recopilar(mi);
      if (!hablando()) hablar(frase);
    } catch (e) {
      $("errEscaneo").textContent = e.message;
      $("errEscaneo").hidden = false;
      await dormir(2500);
    }
    await dormir(500);
  }
}

async function recopilar(mi) {
  subtitulo("Limonero detectado. Mantén la cámara quieta.");
  hablar("Limonero detectado. Mantén la cámara quieta un momento.");
  const frames = [];
  for (let i = 0; i < 4; i++) { await dormir(1300); if (mi !== sesion) return; frames.push(capturar(768)); }

  apagarCamara();
  cambiar("espera");
  setEstado("Analizando");
  $("obs").innerHTML = obs.map((o) => `<li>${esc(o)}</li>`).join("");
  narrarEspera(mi);

  try {
    const d = await llamar("diagnosticar", frames);
    if (mi !== sesion) return;
    clearInterval(timerEspera);
    mostrar(d);
  } catch (e) {
    if (mi !== sesion) return;
    clearInterval(timerEspera);
    cambiar("resultado");
    $("resultado").innerHTML = `<div class="tarjeta"><h2>No pude terminar el análisis</h2><p>${esc(e.message)}</p></div>`;
    hablar("Tuve un problema para terminar el análisis. Intenta de nuevo.");
    setEstado("Error");
  }
}

function narrarEspera(mi) {
  const lineas = [
    "Estoy recopilando los datos del árbol.",
    ...obs.slice(0, 3).map((o) => "Antes vi esto. " + o),
    "Estoy revisando el color y la forma de las hojas.",
    "Comparando con las enfermedades más comunes del limón.",
    "Ya casi termino. Un momento más.",
  ];
  let i = 0;
  const siguiente = () => {
    if (mi !== sesion) return clearInterval(timerEspera);
    const t = lineas[Math.min(i, lineas.length - 1)];
    $("linea").textContent = t;
    if (!hablando() && i < lineas.length) { hablar(t); i++; }
  };
  clearInterval(timerEspera);
  siguiente();
  timerEspera = setInterval(siguiente, 4500);
}

function mostrar(d) {
  cambiar("resultado");
  setEstado("Listo");
  if (d.es_limonero === false) {
    ultimoResumen = "No logré ver bien un limonero. Escanea de nuevo acercándote a las hojas.";
    $("resultado").innerHTML = `<div class="tarjeta"><h2>No vi un limonero</h2>
      <div class="pedir">${esc(d.necesita_mas_info || "Escanea de nuevo y acércate a las hojas o a un fruto.")}</div></div>`;
    return hablar(ultimoResumen);
  }
  const lista = (a) => (a || []).map((x) => `<li>${esc(x)}</li>`).join("");
  const conf = Math.max(0, Math.min(100, Number(d.confianza) || 0));
  $("resultado").innerHTML = `<div class="tarjeta">
    <h2>${esc(d.diagnostico)}</h2>
    <div>Confianza: ${conf}%</div><div class="barra"><i style="width:${conf}%"></i></div>
    <h3>Causas posibles</h3><ul>${lista(d.causas_posibles)}</ul>
    <h3>Qué hacer</h3><ul>${lista(d.recomendaciones)}</ul>
    ${d.necesita_mas_info ? `<div class="pedir">${esc(d.necesita_mas_info)}</div>` : ""}
  </div>`;
  ultimoResumen = d.resumen_voz || `${d.diagnostico}. ${(d.recomendaciones || [])[0] || ""}`;
  hablar(ultimoResumen);
}

function cancelar() {
  sesion++;
  clearInterval(timerEspera);
  speechSynthesis.cancel();
  apagarCamara();
  cambiar("inicio");
  setEstado("Listo");
}

/* ---------- botones ---------- */
$("btnEmpezar").onclick = () => { hablar("Hola, soy Agrobot."); iniciar(); };
$("btnCancelar").onclick = cancelar;
$("btnOtro").onclick = () => { speechSynthesis.cancel(); iniciar(); };
$("btnRepetir").onclick = () => hablar(ultimoResumen);
$("btnVoz").onclick = () => {
  vozOn = !vozOn;
  $("btnVoz").textContent = "Voz: " + (vozOn ? "activada" : "apagada");
  $("btnVoz").setAttribute("aria-pressed", vozOn);
  if (!vozOn) speechSynthesis.cancel();
};
</script>
</body>
</html>
